name: CI Pipeline - Build Stage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go make
      - name: Build program
        run: |
          make build
          mkdir -p usr/bin
          cp factor_app usr/bin/
          chmod +x usr/bin/factor_app
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-program
          path: usr/bin/factor_app
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: built-program
          path: ./usr/bin
      - run: chmod +x ./usr/bin/factor_app
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run tests
        run: |
          cd cicd
          go run test1.go
          go run test2.go
          go run test3.go
  package:
    needs: [build, test]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: built-program
          path: ./usr/bin
      - name: Build .deb package
        run: |
          mkdir -p DEBIAN
          cp control DEBIAN/control
          dpkg-deb --build . go.deb
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: 'go.deb'
          retention-days: 1
  deploy:
    needs: [package]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: .
      - name: Build Docker image
        run: docker build -t factorapp-test .
      - name: Build Docker image with tag
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/factorapp:${{ github.sha }} .
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/factorapp:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/factorapp:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/factorapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/factorapp:latest
      - name: Save Docker image to dist folder (локальный артефакт)
        run: |
          mkdir -p dist
          docker save factorapp-test:latest -o dist/factorapp-container.tar
          gzip -f dist/factorapp-container.tar
          echo "Локальный артефакт контейнера создан:"
          ls -la dist/
      - name: Upload container artifact to dist
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: dist/factorapp-container.tar.gz
          retention-days: 1
