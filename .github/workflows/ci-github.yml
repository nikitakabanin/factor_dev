name: CI Pipeline - Build Stage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go make
      - name: Build program
        run: |
          make build
          mkdir -p usr/bin
          cp factor_app usr/bin/
          chmod +x usr/bin/factor_app
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-program
          path: usr/bin/factor_app
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: built-program
          path: ./usr/bin
      - run: chmod +x ./usr/bin/factor_app
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run tests
        run: |
          cd cicd
          go run test1.go
          go run test2.go
          go run test3.go
  package:
    needs: [build, test]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: built-program
          path: ./usr/bin
      - name: Build .deb package
        run: |
          mkdir -p DEBIAN
          cp control DEBIAN/control
          dpkg-deb --build . go.deb
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: 'go.deb'
          retention-days: 1
  deploy:
    needs: [package]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: pkg

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: factor:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Push Docker image
        run: |
          docker tag factor:latest ${{ secrets.DOCKERHUB_USERNAME }}/factor:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/factor:latest
